<header class="site-header" [class.is-scrolled]="isNavbarScrolled" [class.is-menu-open]="menuOpen()">
  <!-- Clean Executive Brand Mark: NAFI AHMED -->
  <button class="brand" (click)="navigate('hero')" id="nav-logo" aria-label="Nafi Ahmed — Software Engineer">
    <span class="brand__logo-badge">&lt;NA/&gt;</span>
    <span class="brand__name">
      NAFI <em>AHMED</em>
      <small class="brand__tag">ENGINEER</small>
    </span>
  </button>

  <!-- Right Actions: Light/Dark Mode Switcher + Resume Download -->
  <div class="site-header__actions">
    <!-- Light / Dark Mode Toggle Pill -->
    <div class="theme-mode-pill" role="radiogroup" aria-label="Theme Mode">
      <button
        type="button"
        class="theme-mode-pill__btn"
        [class.is-active]="!theme.isDark"
        (click)="setMode('light')"
        title="Light Mode (Glacier)"
        aria-label="Switch to Light Mode">
        <i class="fa-solid fa-sun"></i>
        <span>Light</span>
      </button>
      <button
        type="button"
        class="theme-mode-pill__btn"
        [class.is-active]="theme.isDark"
        (click)="setMode('dark')"
        title="Dark Mode (Executive Slate & Cobalt)"
        aria-label="Switch to Dark Mode">
        <i class="fa-solid fa-moon"></i>
        <span>Dark</span>
      </button>
    </div>

    <a
      href="assets/docs/Nafi_Ahmed_Resume.pdf"
      target="_blank"
      class="header-resume"
      id="btn-nav-resume"
      download>
      <span>{{ t.t("nav.resume") }}</span>
      <i class="fa-solid fa-arrow-down-long"></i>
    </a>

    <button
      type="button"
      class="menu-toggle"
      id="btn-hamburger"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="site-menu"
      aria-label="Toggle navigation"
      (click)="toggleMenu()">
      <span class="menu-toggle__bars" aria-hidden="true">
        <i></i>
        <i></i>
      </span>
    </button>
  </div>
</header>

<!-- Mobile Overlay Menu (Grouped by Unified Tabs + Sub-Sections) -->
<div class="site-menu" id="site-menu" [class.is-open]="menuOpen()" [attr.aria-hidden]="!menuOpen()">
  <nav class="site-menu__nav" aria-label="Mobile Primary">
    @for (group of navGroups; track group.id) {
      <div class="site-menu__group">
        <p class="site-menu__group-title text-mono">{{ group.code }} // {{ group.label }}</p>
        <div class="site-menu__sublist">
          @for (sub of group.children; track sub.id) {
            <button
              type="button"
              class="site-menu__link"
              [class.is-active]="isLinkActive(sub.id)"
              (click)="navigate(sub.id)">
              <span class="site-menu__idx">{{ sub.code }}</span>
              <span class="site-menu__title">{{ t.t(sub.key) }}</span>
              <span class="site-menu__arrow">→</span>
            </button>
          }
        </div>
      </div>
    }

    <div class="site-menu__group">
      <p class="site-menu__group-title text-mono">04 // Direct Uplink</p>
      <button
        type="button"
        class="site-menu__link"
        [class.is-active]="isLinkActive('contact')"
        (click)="navigate('contact')">
        <span class="site-menu__idx">4.1</span>
        <span class="site-menu__title">{{ t.t('nav.contact') }}</span>
        <span class="site-menu__arrow">→</span>
      </button>
    </div>
  </nav>

  <!-- Mobile Theme Mode Switcher Strip -->
  <div class="site-menu__themes">
    <p class="site-menu__themes-label text-mono">INTERFACE THEME</p>
    <div class="site-menu__theme-mode">
      <button
        type="button"
        class="site-menu__theme-mode-btn"
        [class.is-active]="!theme.isDark"
        (click)="setMode('light')">
        <i class="fa-solid fa-sun"></i>
        <span>Light Mode</span>
      </button>
      <button
        type="button"
        class="site-menu__theme-mode-btn"
        [class.is-active]="theme.isDark"
        (click)="setMode('dark')">
        <i class="fa-solid fa-moon"></i>
        <span>Dark Mode</span>
      </button>
    </div>
  </div>

  <div class="site-menu__foot">
    <a
      href="assets/docs/Nafi_Ahmed_Resume.pdf"
      target="_blank"
      class="button button--solid"
      download>
      <span>{{ t.t("nav.resume") }}</span>
      <span class="arrow">↓</span>
    </a>
  </div>
</div>
