<header class="site-header" [class.is-scrolled]="isNavbarScrolled" [class.is-menu-open]="menuOpen()">
  <!-- Clean Single-Line Brand Mark: Nafi (Dev) × Racer007 (Alias) -->
  <button class="brand" (click)="navigate('hero')" id="nav-logo" aria-label="Nafi × Racer007 — Home">
    <svg class="brand__mark" viewBox="0 0 64 48" aria-hidden="true">
      <!-- Hex Shield -->
      <polygon points="32,2 60,12 54,38 32,46 10,38 4,12" fill="#070d19" stroke="var(--amber)" stroke-width="2.5" />
      <!-- Left Code Wing `<` -->
      <path d="M21 15 L11 24 L21 33" fill="none" stroke="var(--red)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Right Aero Wing `>` -->
      <path d="M43 15 L53 24 L43 33" fill="none" stroke="var(--amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Center R -->
      <text x="32" y="30" text-anchor="middle" fill="#edf4fc" font-family="Archivo, sans-serif" font-weight="900" font-size="18">R</text>
    </svg>
    <span class="brand__name">
      NAFI<span class="brand__sep">//</span><em>RACER007</em>
      <small class="brand__tag">&lt;DEV/&gt;</small>
    </span>
  </button>

  <!-- Simplified Primary Navigation -->
  <nav class="site-nav" aria-label="Primary">
    @for (link of navLinks; track link.id) {
      <button
        type="button"
        [id]="'nav-' + link.id"
        class="site-nav__link"
        [class.is-active]="isLinkActive(link.id)"
        (click)="navigate(link.id)">
        {{ t.t(link.key) }}
      </button>
    }
  </nav>

  <!-- Right Actions: R-007 Hood Trigger + Multi-Theme Switcher + Resume -->
  <div class="site-header__actions">
    <button
      type="button"
      class="hood-btn"
      data-cursor="POP HOOD"
      (click)="replayHoodSplash()"
      title="Pop the R 007 Car Hood Splash">
      <i class="fa-solid fa-car-side"></i>
      <span>R 007</span>
    </button>

    <!-- Multi-Theme Bluish Switcher -->
    <div class="theme-switcher">
      <button
        type="button"
        class="theme-btn"
        id="btn-theme-toggle"
        data-cursor="THEME"
        [attr.aria-expanded]="themeMenuOpen()"
        (click)="toggleThemeMenu()"
        [title]="'Theme: ' + theme.currentPreset.name">
        <span class="theme-btn__swatch" [style.background]="theme.currentPreset.swatch"></span>
        <span class="theme-btn__label">{{ theme.currentPreset.shortLabel }}</span>
        <i class="fa-solid fa-chevron-down theme-btn__caret"></i>
      </button>

      @if (themeMenuOpen()) {
        <div class="theme-popover" role="menu" aria-label="Select Bluish Theme">
          @for (preset of theme.presets; track preset.id) {
            <button
              type="button"
              role="menuitem"
              class="theme-popover__item"
              [class.is-active]="theme.theme === preset.id"
              (click)="selectTheme(preset.id)">
              <span class="theme-popover__dot" [style.background]="preset.swatch"></span>
              <span class="theme-popover__name">{{ preset.name }}</span>
              @if (theme.theme === preset.id) {
                <i class="fa-solid fa-check"></i>
              }
            </button>
          }
        </div>
      }
    </div>

    <a
      href="assets/docs/Nafi_Ahmed_Resume.pdf"
      target="_blank"
      class="header-resume"
      id="btn-nav-resume"
      download>
      <span>{{ t.t("nav.resume") }}</span>
      <i class="fa-solid fa-arrow-down-long"></i>
    </a>

    <button
      type="button"
      class="menu-toggle"
      id="btn-hamburger"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="site-menu"
      aria-label="Toggle navigation"
      (click)="toggleMenu()">
      <span class="menu-toggle__bars" aria-hidden="true">
        <i></i>
        <i></i>
      </span>
    </button>
  </div>
</header>

<!-- Mobile Overlay Menu -->
<div class="site-menu" id="site-menu" [class.is-open]="menuOpen()" [attr.aria-hidden]="!menuOpen()">
  <nav class="site-menu__nav" aria-label="Mobile Primary">
    @for (link of navLinks; track link.id; let i = $index) {
      <button
        type="button"
        class="site-menu__link"
        [class.is-active]="isLinkActive(link.id)"
        (click)="navigate(link.id)">
        <span class="site-menu__idx">0{{ i + 2 }}</span>
        <span class="site-menu__title">{{ t.t(link.key) }}</span>
        <span class="site-menu__arrow">→</span>
      </button>
    }
  </nav>

  <div class="site-menu__foot">
    <button type="button" class="button" (click)="replayHoodSplash()">
      <span>POP R 007 HOOD</span>
      <span class="arrow">↗</span>
    </button>
    <a
      href="assets/docs/Nafi_Ahmed_Resume.pdf"
      target="_blank"
      class="button button--solid"
      download>
      <span>{{ t.t("nav.resume") }}</span>
      <span class="arrow">↓</span>
    </a>
  </div>
</div>
