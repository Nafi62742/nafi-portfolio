@if (sceneService.splashOpen()) {
  <div
    class="loader"
    [class.is-hood-open]="hoodPopped()"
    [class.is-exiting]="isExiting()"
    role="dialog"
    aria-modal="true"
    aria-label="R 007 Ignition Splash Screen">

    <!-- Minimal Top Header Bar -->
    <header class="loader__top">
      <div class="loader__brand">
        <span class="loader__dot"></span>
        <span class="loader__code">R-007 // {{ sceneService.config().splash.model }}</span>
      </div>

      <div class="loader__top-right">
        <div class="loader__rpm">
          <span>{{ rpmValue() }}</span>
          <small>RPM</small>
        </div>
        <button type="button" class="loader__skip-btn" (click)="dismissSplash()">
          <span>SKIP</span>
          <span aria-hidden="true">→</span>
        </button>
      </div>
    </header>

    <!-- Center Simplified R-007 Carbon Hood & Mechanical V10 Engine Bay Stage -->
    <div class="loader__stage">
      <div
        class="hood-car"
        [class.is-open]="hoodPopped()"
        role="button"
        tabindex="0"
        aria-label="Click to toggle the R 007 car hood"
        (click)="popHoodNow()"
        (keydown.enter)="popHoodNow()">

        <!-- 1. MECHANICALLY DETAILED 5.2L V10 TWIN-TURBO ENGINE BAY -->
        <svg class="hood-car__engine-svg" viewBox="0 0 540 410" aria-hidden="true">
          <defs>
            <radialGradient id="engine-core-glow" cx="50%" cy="48%" r="48%">
              <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28" />
              <stop offset="55%" stop-color="#2563eb" stop-opacity="0.12" />
              <stop offset="100%" stop-color="#040811" stop-opacity="0" />
            </radialGradient>

            <linearGradient id="chassis-shell" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#101f38" />
              <stop offset="50%" stop-color="#070e1b" />
              <stop offset="100%" stop-color="#142747" />
            </linearGradient>

            <linearGradient id="gunmetal" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#334155" />
              <stop offset="50%" stop-color="#1e293b" />
              <stop offset="100%" stop-color="#0f172a" />
            </linearGradient>

            <linearGradient id="brushed-alu" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#64748b" />
              <stop offset="50%" stop-color="#cbd5e1" />
              <stop offset="100%" stop-color="#475569" />
            </linearGradient>

            <linearGradient id="carbon-plenum" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#1e293b" />
              <stop offset="50%" stop-color="#0f172a" />
              <stop offset="100%" stop-color="#1e293b" />
            </linearGradient>

            <linearGradient id="valve-cover" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#1d4ed8" />
              <stop offset="50%" stop-color="#2563eb" />
              <stop offset="100%" stop-color="#1e3a8a" />
            </linearGradient>

            <linearGradient id="header-pipe" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8" />
              <stop offset="50%" stop-color="#64748b" />
              <stop offset="100%" stop-color="#1e293b" />
            </linearGradient>
          </defs>

          <!-- Outer Sports Car Front Fenders & Nose Cowl -->
          <path
            d="M94 34 L446 34 L488 164 L466 342 L406 378 L134 378 L74 342 L52 164 Z"
            fill="url(#chassis-shell)"
            stroke="#38bdf8"
            stroke-width="1.75"
            stroke-opacity="0.78" />

          <!-- Front Aerodynamic Splitter & Grille Lip -->
          <polygon
            points="170,376 370,376 352,394 188,394"
            fill="#091120"
            stroke="#38bdf8"
            stroke-width="1.4" />

          <!-- Matrix LED Cyber Headlights -->
          <g class="hood-car__headlights">
            <polygon points="78,324 152,344 146,358 72,340" fill="#38bdf8" />
            <polygon points="83,327 146,344 143,352 80,336" fill="#f8fafc" />
            <polygon points="462,324 388,344 394,358 468,340" fill="#38bdf8" />
            <polygon points="457,327 394,344 397,352 460,336" fill="#f8fafc" />
          </g>

          <!-- Recessed Carbon-Tub Engine Bay Cavity -->
          <path
            d="M122 58 L418 58 L446 172 L426 326 L114 326 L94 172 Z"
            fill="#040811"
            stroke="#1e3a8a"
            stroke-width="2.2" />

          <!-- Mechanical Subframe Rails & Firewall Bulkhead -->
          <line x1="158" y1="60" x2="148" y2="324" stroke="#1e293b" stroke-width="6" />
          <line x1="382" y1="60" x2="392" y2="324" stroke="#1e293b" stroke-width="6" />
          <rect x="130" y="60" width="280" height="12" fill="#0f172a" stroke="#334155" stroke-width="1" />

          <!-- Ambient Engine Bay Core Glow -->
          <ellipse cx="270" cy="195" rx="160" ry="118" fill="url(#engine-core-glow)" />

          <!-- ============================================================ -->
          <!-- LEFT & RIGHT MACPHERSON / BILLET SHOCK TOWERS & STRUT MOUNTS -->
          <!-- ============================================================ -->
          <g transform="translate(132, 96)">
            <circle cx="0" cy="0" r="18" fill="url(#gunmetal)" stroke="#64748b" stroke-width="1.8" />
            <circle cx="0" cy="0" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
            <circle cx="-11" cy="-6" r="2" fill="#cbd5e1" />
            <circle cx="11" cy="-6" r="2" fill="#cbd5e1" />
            <circle cx="0" cy="12" r="2" fill="#cbd5e1" />
          </g>
          <g transform="translate(408, 96)">
            <circle cx="0" cy="0" r="18" fill="url(#gunmetal)" stroke="#64748b" stroke-width="1.8" />
            <circle cx="0" cy="0" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
            <circle cx="-11" cy="-6" r="2" fill="#cbd5e1" />
            <circle cx="11" cy="-6" r="2" fill="#cbd5e1" />
            <circle cx="0" cy="12" r="2" fill="#cbd5e1" />
          </g>

          <!-- Coolant Expansion Reservoir (Top Left) & Brake Fluid / Oil Dry-Sump Tank (Top Right) -->
          <rect x="156" y="68" width="34" height="22" rx="4" fill="#0c192e" stroke="#38bdf8" stroke-width="1.2" />
          <line x1="162" y1="79" x2="184" y2="79" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7" />
          <circle cx="182" cy="74" r="3.5" fill="#2563eb" stroke="#bae6fd" stroke-width="1" />

          <rect x="350" y="68" width="34" height="22" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.2" />
          <circle cx="367" cy="79" r="5" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2" />

          <!-- ============================================================ -->
          <!-- TUBULAR 5-INTO-1 EXHAUST HEADERS (LEFT & RIGHT BANKS)        -->
          <!-- ============================================================ -->
          <g stroke="url(#header-pipe)" stroke-width="4.5" stroke-linecap="round" fill="none">
            <!-- Left Bank 5 Exhaust Primary Tubes feeding Left Turbo -->
            <path d="M198 134 C172 134, 162 146, 152 162" />
            <path d="M198 154 C174 154, 164 160, 154 170" />
            <path d="M198 174 C176 174, 166 174, 156 176" />
            <path d="M198 194 C174 194, 164 188, 154 182" />
            <path d="M198 214 C172 214, 162 200, 152 188" />

            <!-- Right Bank 5 Exhaust Primary Tubes feeding Right Turbo -->
            <path d="M342 134 C368 134, 378 146, 388 162" />
            <path d="M342 154 C366 154, 376 160, 386 170" />
            <path d="M342 174 C364 174, 374 174, 384 176" />
            <path d="M342 194 C366 194, 376 188, 386 182" />
            <path d="M342 214 C368 214, 378 200, 388 188" />
          </g>

          <!-- ============================================================ -->
          <!-- TWIN-TURBOCHARGERS WITH VOLUTE SCROLLS & CONE AIR FILTERS    -->
          <!-- ============================================================ -->
          <!-- Left Turbocharger Assembly -->
          <g transform="translate(138, 184)">
            <!-- High-Flow Cone Air Filter (Top of Turbo) -->
            <polygon points="-14,-56 14,-56 19,-32 -19,-32" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1.3" />
            <line x1="-15" y1="-48" x2="15" y2="-48" stroke="#60a5fa" stroke-width="1" />
            <line x1="-17" y1="-40" x2="17" y2="-40" stroke="#60a5fa" stroke-width="1" />

            <!-- Snail Volute Compressor Housing -->
            <path
              d="M -28,0 A 28,28 0 1,1 24,14 L 26,38 L 8,38 L 10,26 A 28,28 0 0,1 -28,0 Z"
              fill="url(#brushed-alu)"
              stroke="#94a3b8"
              stroke-width="1.6" />
            <circle cx="0" cy="0" r="21" fill="#070d19" stroke="#38bdf8" stroke-width="1.6" />

            <!-- Spinning Billet 10-Blade Compressor Wheel -->
            <g class="engine__turbo">
              <line x1="-18" y1="0" x2="18" y2="0" stroke="#cbd5e1" stroke-width="2" />
              <line x1="0" y1="-18" x2="0" y2="18" stroke="#cbd5e1" stroke-width="2" />
              <line x1="-13" y1="-13" x2="13" y2="13" stroke="#38bdf8" stroke-width="1.8" />
              <line x1="13" y1="-13" x2="-13" y2="13" stroke="#38bdf8" stroke-width="1.8" />
              <line x1="-7" y1="-16" x2="7" y2="16" stroke="#94a3b8" stroke-width="1.4" />
              <line x1="16" y1="-7" x2="-16" y2="7" stroke="#94a3b8" stroke-width="1.4" />
              <circle cx="0" cy="0" r="5.5" fill="#2563eb" stroke="#f8fafc" stroke-width="1.4" />
            </g>
          </g>

          <!-- Right Turbocharger Assembly -->
          <g transform="translate(402, 184)">
            <!-- High-Flow Cone Air Filter -->
            <polygon points="-14,-56 14,-56 19,-32 -19,-32" fill="#1e3a8a" stroke="#38bdf8" stroke-width="1.3" />
            <line x1="-15" y1="-48" x2="15" y2="-48" stroke="#60a5fa" stroke-width="1" />
            <line x1="-17" y1="-40" x2="17" y2="-40" stroke="#60a5fa" stroke-width="1" />

            <!-- Snail Volute Compressor Housing -->
            <path
              d="M 28,0 A 28,28 0 1,0 -24,14 L -26,38 L -8,38 L -10,26 A 28,28 0 0,0 28,0 Z"
              fill="url(#brushed-alu)"
              stroke="#94a3b8"
              stroke-width="1.6" />
            <circle cx="0" cy="0" r="21" fill="#070d19" stroke="#38bdf8" stroke-width="1.6" />

            <!-- Spinning Billet 10-Blade Compressor Wheel -->
            <g class="engine__turbo engine__turbo--reverse">
              <line x1="-18" y1="0" x2="18" y2="0" stroke="#cbd5e1" stroke-width="2" />
              <line x1="0" y1="-18" x2="0" y2="18" stroke="#cbd5e1" stroke-width="2" />
              <line x1="-13" y1="-13" x2="13" y2="13" stroke="#38bdf8" stroke-width="1.8" />
              <line x1="13" y1="-13" x2="-13" y2="13" stroke="#38bdf8" stroke-width="1.8" />
              <line x1="-7" y1="-16" x2="7" y2="16" stroke="#94a3b8" stroke-width="1.4" />
              <line x1="16" y1="-7" x2="-16" y2="7" stroke="#94a3b8" stroke-width="1.4" />
              <circle cx="0" cy="0" r="5.5" fill="#2563eb" stroke="#f8fafc" stroke-width="1.4" />
            </g>
          </g>

          <!-- ============================================================ -->
          <!-- TITANIUM CHARGE PIPES & SILICONE BOOST COUPLERS              -->
          <!-- ============================================================ -->
          <!-- Left Charge Pipe from Turbo Outlet to Dual Throttle Body -->
          <path
            d="M 155 222 C 155 268, 224 272, 250 242"
            fill="none"
            stroke="url(#brushed-alu)"
            stroke-width="10"
            stroke-linecap="round" />
          <!-- Blue Silicone Hose Couplers -->
          <rect x="149" y="218" width="12" height="8" rx="2" fill="#2563eb" stroke="#38bdf8" stroke-width="1" />
          <rect x="242" y="236" width="12" height="9" rx="2" fill="#2563eb" stroke="#38bdf8" stroke-width="1" />

          <!-- Right Charge Pipe from Turbo Outlet to Dual Throttle Body -->
          <path
            d="M 385 222 C 385 268, 316 272, 290 242"
            fill="none"
            stroke="url(#brushed-alu)"
            stroke-width="10"
            stroke-linecap="round" />
          <!-- Blue Silicone Hose Couplers -->
          <rect x="379" y="218" width="12" height="8" rx="2" fill="#2563eb" stroke="#38bdf8" stroke-width="1" />
          <rect x="286" y="236" width="12" height="9" rx="2" fill="#2563eb" stroke="#38bdf8" stroke-width="1" />

          <!-- ============================================================ -->
          <!-- CENTER 5.2L V10 ENGINE BLOCK, VALVE COVERS & INTAKE MANIFOLD -->
          <!-- ============================================================ -->
          <g class="engine__block" transform="translate(270, 174)">
            <!-- Underlying Cast Aluminum V10 Crankcase / Cylinder Block Deck -->
            <rect x="-82" y="-76" width="164" height="148" rx="8" fill="url(#gunmetal)" stroke="#475569" stroke-width="2" />

            <!-- LEFT CYLINDER HEAD VALVE COVER (Cylinders 1 - 5) -->
            <rect x="-76" y="-68" width="30" height="128" rx="4" fill="url(#valve-cover)" stroke="#60a5fa" stroke-width="1.5" />
            <!-- Oil Filler Cap on Left Valve Cover -->
            <circle cx="-61" cy="-55" r="6" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.3" />
            <line x1="-64" y1="-55" x2="-58" y2="-55" stroke="#38bdf8" stroke-width="1.5" />

            <!-- RIGHT CYLINDER HEAD VALVE COVER (Cylinders 6 - 10) -->
            <rect x="46" y="-68" width="30" height="128" rx="4" fill="url(#valve-cover)" stroke="#60a5fa" stroke-width="1.5" />

            <!-- 10 CAST ALUMINUM INTAKE RUNNERS (5 Left, 5 Right bridging Plenum to Heads) -->
            <g fill="url(#brushed-alu)" stroke="#1e293b" stroke-width="1">
              <!-- Left 5 Runners -->
              <rect x="-48" y="-50" width="20" height="9" rx="2" />
              <rect x="-48" y="-28" width="20" height="9" rx="2" />
              <rect x="-48" y="-6"  width="20" height="9" rx="2" />
              <rect x="-48" y="16"  width="20" height="9" rx="2" />
              <rect x="-48" y="38"  width="20" height="9" rx="2" />

              <!-- Right 5 Runners -->
              <rect x="28" y="-50" width="20" height="9" rx="2" />
              <rect x="28" y="-28" width="20" height="9" rx="2" />
              <rect x="28" y="-6"  width="20" height="9" rx="2" />
              <rect x="28" y="16"  width="20" height="9" rx="2" />
              <rect x="28" y="38"  width="20" height="9" rx="2" />
            </g>

            <!-- High-Pressure Billet Fuel Rails (Left & Right) -->
            <line x1="-44" y1="-56" x2="-44" y2="52" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
            <line x1="44"  y1="-56" x2="44"  y2="52" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

            <!-- 10 Direct-Ignition Coil Packs (5 per Cylinder Bank firing in V10 sequence) -->
            <!-- Left Bank Coils (Cyl 1-5) -->
            <rect class="engine__coil engine__coil--1" x="-69" y="-42" width="16" height="12" rx="2" fill="#38bdf8" stroke="#0f172a" stroke-width="1" />
            <rect class="engine__coil engine__coil--2" x="-69" y="-22" width="16" height="12" rx="2" fill="#38bdf8" stroke="#0f172a" stroke-width="1" />
            <rect class="engine__coil engine__coil--3" x="-69" y="-2"  width="16" height="12" rx="2" fill="#38bdf8" stroke="#0f172a" stroke-width="1" />
            <rect class="engine__coil engine__coil--4" x="-69" y="18"  width="16" height="12" rx="2" fill="#38bdf8" stroke="#0f172a" stroke-width="1" />
            <rect class="engine__coil engine__coil--5" x="-69" y="38"  width="16" height="12" rx="2" fill="#38bdf8" stroke="#0f172a" stroke-width="1" />

            <!-- Right Bank Coils (Cyl 6-10) -->
            <rect class="engine__coil engine__coil--3" x="53" y="-42" width="16" height="12" rx="2" fill="#38bdf8" stroke="#0f172a" stroke-width="1" />
            <rect class="engine__coil engine__coil--5" x="53" y="-22" width="16" height="12" rx="2" fill="#38bdf8" stroke="#0f172a" stroke-width="1" />
            <rect class="engine__coil engine__coil--1" x="53" y="-2"  width="16" height="12" rx="2" fill="#38bdf8" stroke="#0f172a" stroke-width="1" />
            <rect class="engine__coil engine__coil--2" x="53" y="18"  width="16" height="12" rx="2" fill="#38bdf8" stroke="#0f172a" stroke-width="1" />
            <rect class="engine__coil engine__coil--4" x="53" y="38"  width="16" height="12" rx="2" fill="#38bdf8" stroke="#0f172a" stroke-width="1" />

            <!-- CENTER SCULPTED CARBON-FIBER V10 INTAKE PLENUM -->
            <path
              d="M -30,-66 L 30,-66 L 34,-48 L 34,46 L 26,62 L -26,62 L -34,46 L -34,-48 Z"
              fill="url(#carbon-plenum)"
              stroke="#38bdf8"
              stroke-width="1.8" />

            <!-- Machined Structural Ribs on Intake Plenum -->
            <line x1="-28" y1="-42" x2="28" y2="-42" stroke="#334155" stroke-width="2.5" />
            <line x1="-28" y1="-24" x2="28" y2="-24" stroke="#334155" stroke-width="2.5" />
            <line x1="-28" y1="24"  x2="28" y2="24"  stroke="#334155" stroke-width="2.5" />
            <line x1="-28" y1="40"  x2="28" y2="40"  stroke="#334155" stroke-width="2.5" />

            <!-- Center V10FSI / R-007 Engine Builder Plaque -->
            <rect x="-24" y="-16" width="48" height="32" rx="3" fill="#091326" stroke="#38bdf8" stroke-width="1.2" />
            <text x="0" y="-2" text-anchor="middle" fill="#f8fafc" font-family="Archivo, sans-serif" font-weight="800" font-size="10.5" letter-spacing="1.5">V10 FSI</text>
            <text x="0" y="10" text-anchor="middle" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-weight="700" font-size="7" letter-spacing="1.2">5.2L // R007</text>

            <!-- Dual Drive-By-Wire Throttle Bodies at Front of Plenum -->
            <rect x="-24" y="56" width="18" height="14" rx="2" fill="url(#brushed-alu)" stroke="#475569" stroke-width="1.2" />
            <rect x="6"   y="56" width="18" height="14" rx="2" fill="url(#brushed-alu)" stroke="#475569" stroke-width="1.2" />

            <!-- ============================================================ -->
            <!-- FRONT SERPENTINE ACCESSORY BELT DRIVE & PULLEYS              -->
            <!-- ============================================================ -->
            <g transform="translate(0, 82)">
              <!-- Serpentine Drive Belt Loop -->
              <path
                class="engine__belt"
                d="M -42,0 L 0,-8 L 42,0 L 24,14 L -24,14 Z"
                fill="none"
                stroke="#38bdf8"
                stroke-width="2.5"
                stroke-dasharray="5 3" />

              <!-- Center Harmonic Balancer / Crankshaft Pulley -->
              <circle cx="0" cy="4" r="11" fill="#0f172a" stroke="#94a3b8" stroke-width="2" />
              <circle cx="0" cy="4" r="4" fill="#38bdf8" />

              <!-- Left Alternator Pulley -->
              <circle cx="-42" cy="0" r="8" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.8" />
              <circle cx="-42" cy="0" r="2.5" fill="#64748b" />

              <!-- Right A/C Compressor / Dry-Sump Pump Pulley -->
              <circle cx="42" cy="0" r="8" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.8" />
              <circle cx="42" cy="0" r="2.5" fill="#64748b" />

              <!-- Idler / Tensioner Pulleys -->
              <circle cx="-22" cy="12" r="5" fill="#1e293b" stroke="#94a3b8" stroke-width="1.4" />
              <circle cx="22"  cy="12" r="5" fill="#1e293b" stroke="#94a3b8" stroke-width="1.4" />
            </g>
          </g>

          <!-- ============================================================ -->
          <!-- FRONT ALUMINUM RADIATOR CORE & DUAL ELECTRIC COOLING FANS    -->
          <!-- ============================================================ -->
          <g transform="translate(270, 304)">
            <!-- Finned Aluminum Radiator & Front-Mount Intercooler Core -->
            <rect x="-118" y="-14" width="236" height="24" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1.6" />
            <!-- Radiator Cooling Fins -->
            <line x1="-112" y1="-8" x2="112" y2="-8" stroke="#334155" stroke-width="1" stroke-dasharray="3 2" />
            <line x1="-112" y1="4"  x2="112" y2="4"  stroke="#334155" stroke-width="1" stroke-dasharray="3 2" />

            <!-- Left Electric Cooling Fan Shroud & Spinning Blades -->
            <g transform="translate(-58, -2)">
              <circle cx="0" cy="0" r="14" fill="#050a14" stroke="#38bdf8" stroke-width="1.2" />
              <g class="engine__turbo">
                <line x1="-11" y1="0" x2="11" y2="0" stroke="#64748b" stroke-width="2" />
                <line x1="0" y1="-11" x2="0" y2="11" stroke="#64748b" stroke-width="2" />
                <line x1="-8" y1="-8" x2="8" y2="8" stroke="#64748b" stroke-width="2" />
                <line x1="8" y1="-8" x2="-8" y2="8" stroke="#64748b" stroke-width="2" />
                <circle cx="0" cy="0" r="3.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
              </g>
            </g>

            <!-- Right Electric Cooling Fan Shroud & Spinning Blades -->
            <g transform="translate(58, -2)">
              <circle cx="0" cy="0" r="14" fill="#050a14" stroke="#38bdf8" stroke-width="1.2" />
              <g class="engine__turbo engine__turbo--reverse">
                <line x1="-11" y1="0" x2="11" y2="0" stroke="#64748b" stroke-width="2" />
                <line x1="0" y1="-11" x2="0" y2="11" stroke="#64748b" stroke-width="2" />
                <line x1="-8" y1="-8" x2="8" y2="8" stroke="#64748b" stroke-width="2" />
                <line x1="8" y1="-8" x2="-8" y2="8" stroke="#64748b" stroke-width="2" />
                <circle cx="0" cy="0" r="3.5" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
              </g>
            </g>
          </g>

          <!-- ============================================================ -->
          <!-- AUDI R8 STYLE CARBON / BILLET STRUT TOWER BRACE OVER ENGINE  -->
          <!-- ============================================================ -->
          <path
            d="M 132 96 L 210 82 L 330 82 L 408 96"
            fill="none"
            stroke="url(#brushed-alu)"
            stroke-width="6"
            stroke-linecap="round" />
          <path
            d="M 132 96 L 210 82 L 330 82 L 408 96"
            fill="none"
            stroke="#38bdf8"
            stroke-width="1.2"
            stroke-opacity="0.65" />
        </svg>

        <!-- 2. SCULPTED HOOD PANEL WITH R-007 CREST (Lifts cleanly upward on ignition) -->
        <div class="hood-car__lid">
          <svg class="hood-car__lid-svg" viewBox="0 0 540 410" aria-hidden="true">
            <defs>
              <linearGradient id="hood-paint" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#10203d" />
                <stop offset="50%" stop-color="#081121" />
                <stop offset="100%" stop-color="#152b52" />
              </linearGradient>
            </defs>

            <!-- Sculpted Carbon Hood Panel -->
            <path
              d="M118 56 L422 56 L448 172 L428 328 L112 328 L92 172 Z"
              fill="url(#hood-paint)"
              stroke="#38bdf8"
              stroke-width="2" />

            <!-- Subtle Power-Dome Crease Lines -->
            <path d="M154 70 L184 314" stroke="#38bdf8" stroke-width="1.1" stroke-opacity="0.38" />
            <path d="M386 70 L356 314" stroke="#38bdf8" stroke-width="1.1" stroke-opacity="0.38" />

            <!-- Center Hexagonal R-007 Shield -->
            <g transform="translate(270, 192)">
              <polygon
                points="0,-74 92,-38 76,54 0,78 -76,54 -92,-38"
                fill="#060c18"
                fill-opacity="0.94"
                stroke="#38bdf8"
                stroke-width="2" />

              <text
                x="0"
                y="-44"
                text-anchor="middle"
                fill="#93c5fd"
                font-family="JetBrains Mono, monospace"
                font-weight="700"
                font-size="10.5"
                letter-spacing="3.5">&lt;NAFI/&gt;</text>

              <text
                x="0"
                y="-2"
                text-anchor="middle"
                fill="#f8fafc"
                font-family="Archivo, sans-serif"
                font-weight="900"
                font-size="50"
                letter-spacing="3">R</text>

              <rect x="-44" y="6" width="88" height="3" fill="#2563eb" />
              <rect x="-18" y="6" width="36" height="3" fill="#38bdf8" />

              <text
                x="0"
                y="42"
                text-anchor="middle"
                fill="#38bdf8"
                font-family="JetBrains Mono, monospace"
                font-weight="800"
                font-size="32"
                letter-spacing="6">007</text>
            </g>
          </svg>
        </div>
      </div>

      <!-- Subtle Interactive Status Pill -->
      <button type="button" class="loader__hint" (click)="popHoodNow()">
        <span class="loader__hint-dot"></span>
        <span>{{ hoodPopped() ? '5.2L V10 BITURBO RUNNING · CLICK TO CLOSE HOOD' : 'UNLOCKING HOOD · CLICK TO POP NOW' }}</span>
      </button>
    </div>

    <!-- Streamlined Bottom Progress & Status Bar -->
    <footer class="loader__foot">
      <div class="loader__bar-row">
        <span class="loader__status">{{ currentStatus() }}</span>
        <span class="loader__pct">{{ progress() }}%</span>
      </div>
      <div class="loader__track">
        <span class="loader__fill" [style.width.%]="progress()"></span>
      </div>
    </footer>
  </div>
}
