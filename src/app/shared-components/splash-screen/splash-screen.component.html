@if (sceneService.splashOpen()) {
  <div
    class="loader"
    [class.is-hood-open]="hoodPopped()"
    [class.is-exiting]="isExiting()"
    role="dialog"
    aria-modal="true"
    aria-label="R 007 Ignition Splash Screen">

    <!-- Minimal Top Header Bar -->
    <header class="loader__top">
      <div class="loader__brand">
        <span class="loader__dot"></span>
        <span class="loader__code">R-007 // {{ sceneService.config().splash.model }}</span>
      </div>

      <div class="loader__top-right">
        <div class="loader__rpm">
          <span>{{ rpmValue() }}</span>
          <small>RPM</small>
        </div>
        <button type="button" class="loader__skip-btn" (click)="dismissSplash()">
          <span>SKIP</span>
          <span aria-hidden="true">→</span>
        </button>
      </div>
    </header>

    <!-- Free-standing front view of the R-007 supercar (no frame / box) -->
    <div class="loader__stage">
      <div
        class="hood-car"
        [class.is-open]="hoodPopped()"
        role="button"
        tabindex="0"
        aria-label="Click to open or close the R 007 car hood"
        (click)="popHoodNow()"
        (keydown.enter)="popHoodNow()">

        <!-- ============================================================ -->
        <!-- LAYER 1: CAR BODY, CABIN, ENGINE BAY, LIGHTS & GRILLE         -->
        <!-- Design cues: Camaro (wide stance, lower intake), GT-R (sharp  -->
        <!-- headlights, side ducts), R8 (LED DRL hook), Veyron (center    -->
        <!-- horseshoe grille). No manufacturer logos.                     -->
        <!-- ============================================================ -->
        <svg class="hood-car__body-svg" viewBox="0 0 640 560" aria-hidden="true">
          <defs>
            <linearGradient id="r7-body" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#3b82f6" />
              <stop offset="35%" stop-color="#1d4ed8" />
              <stop offset="70%" stop-color="#1e3a8a" />
              <stop offset="100%" stop-color="#0b1f4d" />
            </linearGradient>
            <linearGradient id="r7-body-side" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#0b1f4d" stop-opacity="0.75" />
              <stop offset="18%" stop-color="#0b1f4d" stop-opacity="0" />
              <stop offset="82%" stop-color="#0b1f4d" stop-opacity="0" />
              <stop offset="100%" stop-color="#0b1f4d" stop-opacity="0.75" />
            </linearGradient>
            <linearGradient id="r7-glass" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#1e293b" />
              <stop offset="100%" stop-color="#0b1220" />
            </linearGradient>
            <linearGradient id="r7-chrome" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#f8fafc" />
              <stop offset="50%" stop-color="#94a3b8" />
              <stop offset="100%" stop-color="#e2e8f0" />
            </linearGradient>
            <linearGradient id="r7-cover" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#374151" />
              <stop offset="55%" stop-color="#1f2937" />
              <stop offset="100%" stop-color="#0b0f17" />
            </linearGradient>
            <radialGradient id="r7-shadow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#000000" stop-opacity="0.7" />
              <stop offset="100%" stop-color="#000000" stop-opacity="0" />
            </radialGradient>
            <pattern id="r7-mesh" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <rect width="8" height="8" fill="#05080f" />
              <line x1="0" y1="0" x2="0" y2="8" stroke="#334155" stroke-width="1.6" />
              <line x1="0" y1="0" x2="8" y2="0" stroke="#334155" stroke-width="1.6" />
            </pattern>
          </defs>

          <!-- Ground shadow -->
          <ellipse cx="320" cy="530" rx="310" ry="22" fill="url(#r7-shadow)" />

          <!-- Cabin: roof, A-pillars & windshield -->
          <path d="M 200 148 Q 320 130 440 148 L 542 258 L 98 258 Z" fill="url(#r7-body)" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.4" />
          <path d="M 192 170 Q 320 156 448 170 L 516 252 L 124 252 Z" fill="url(#r7-glass)" />
          <path d="M 206 176 L 262 172 L 196 248 L 150 248 Z" fill="#93c5fd" fill-opacity="0.07" />
          <rect x="304" y="174" width="32" height="8" rx="3" fill="#05080f" />

          <!-- Side mirrors -->
          <path d="M 112 236 L 64 226 Q 52 234 58 248 L 108 254 Z" fill="url(#r7-body)" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.4" />
          <path d="M 528 236 L 576 226 Q 588 234 582 248 L 532 254 Z" fill="url(#r7-body)" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.4" />

          <!-- Front body: fenders, nose & bumper -->
          <path
            d="M 100 254 L 540 254 C 582 262 612 292 620 332 L 628 420 C 630 470 620 506 600 520 L 40 520 C 20 506 10 470 12 420 L 20 332 C 28 292 58 262 100 254 Z"
            fill="url(#r7-body)" />
          <path
            d="M 100 254 L 540 254 C 582 262 612 292 620 332 L 628 420 C 630 470 620 506 600 520 L 40 520 C 20 506 10 470 12 420 L 20 332 C 28 292 58 262 100 254 Z"
            fill="url(#r7-body-side)" />
          <!-- Fender character lines -->
          <path d="M 96 262 C 60 290 38 330 34 390" fill="none" stroke="#93c5fd" stroke-width="1.4" stroke-opacity="0.45" />
          <path d="M 544 262 C 580 290 602 330 606 390" fill="none" stroke="#93c5fd" stroke-width="1.4" stroke-opacity="0.45" />

          <!-- ======================= ENGINE BAY ======================= -->
          <path d="M 134 256 L 506 256 L 550 392 Q 320 406 90 392 Z" fill="#070b13" />

          <!-- Cowl panel with vent slots -->
          <path d="M 140 258 L 500 258 L 508 284 L 132 284 Z" fill="#111827" stroke="#1f2937" />
          <g stroke="#05080f" stroke-width="3" stroke-linecap="round">
            <line x1="250" y1="268" x2="300" y2="268" />
            <line x1="250" y1="276" x2="300" y2="276" />
            <line x1="340" y1="268" x2="390" y2="268" />
            <line x1="340" y1="276" x2="390" y2="276" />
          </g>

          <!-- Strut towers -->
          <ellipse cx="152" cy="300" rx="20" ry="11" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
          <circle cx="152" cy="300" r="5" fill="#94a3b8" />
          <ellipse cx="488" cy="300" rx="20" ry="11" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
          <circle cx="488" cy="300" r="5" fill="#94a3b8" />

          <!-- Battery (left) -->
          <rect x="178" y="298" width="48" height="36" rx="3" fill="#111827" stroke="#374151" />
          <rect x="182" y="292" width="8" height="6" rx="1" fill="#dc2626" />
          <rect x="212" y="292" width="8" height="6" rx="1" fill="#1f2937" stroke="#4b5563" />

          <!-- Coolant reservoir (left, translucent beige) -->
          <rect x="106" y="338" width="70" height="36" rx="6" fill="#d6cfc0" stroke="#a8a29e" />
          <line x1="112" y1="356" x2="170" y2="356" stroke="#a8a29e" stroke-dasharray="3 3" />
          <ellipse cx="160" cy="338" rx="9" ry="4" fill="#1d4ed8" />

          <!-- Engine cover (center) -->
          <g class="engine__cover">
            <path d="M 250 290 L 390 290 Q 404 292 406 306 L 412 360 Q 412 374 398 376 L 242 376 Q 228 374 228 360 L 234 306 Q 236 292 250 290 Z"
              fill="url(#r7-cover)" stroke="#4b5563" stroke-width="1.2" />
            <path d="M 268 300 L 372 300 L 380 344 L 260 344 Z" fill="#111827" stroke="#374151" />
            <g stroke="#374151" stroke-width="2.4" stroke-linecap="round">
              <line x1="274" y1="310" x2="366" y2="310" />
              <line x1="272" y1="320" x2="368" y2="320" />
              <line x1="270" y1="330" x2="370" y2="330" />
            </g>
            <text x="320" y="364" text-anchor="middle" fill="#6b7280" font-family="Archivo, sans-serif" font-weight="800" font-size="11" letter-spacing="3">R 007</text>
            <circle cx="392" cy="300" r="5" fill="#4b5563" stroke="#9ca3af" />
          </g>

          <!-- Air filter box (right) -->
          <rect x="418" y="296" width="62" height="42" rx="5" fill="#111827" stroke="#374151" />
          <g stroke="#1f2937" stroke-width="2">
            <line x1="424" y1="306" x2="474" y2="306" />
            <line x1="424" y1="316" x2="474" y2="316" />
            <line x1="424" y1="326" x2="474" y2="326" />
          </g>
          <!-- Fuse box -->
          <rect x="418" y="344" width="42" height="28" rx="3" fill="#1f2937" stroke="#374151" />
          <!-- Washer reservoir -->
          <rect x="466" y="340" width="68" height="34" rx="6" fill="#d6cfc0" stroke="#a8a29e" />
          <ellipse cx="482" cy="340" rx="8" ry="4" fill="#38bdf8" />

          <!-- Radiator crossmember (body colour with cut-outs) -->
          <path d="M 100 376 L 540 376 L 548 396 Q 320 410 92 396 Z" fill="#1d4ed8" stroke="#3b82f6" />
          <g fill="#070b13">
            <rect x="150" y="382" width="40" height="8" rx="4" />
            <rect x="230" y="383" width="50" height="8" rx="4" />
            <rect x="360" y="383" width="50" height="8" rx="4" />
            <rect x="450" y="382" width="40" height="8" rx="4" />
          </g>

          <!-- Hood struts (shown only when the hood is open) -->
          <g class="hood-car__struts" stroke-linecap="round">
            <line x1="160" y1="170" x2="142" y2="300" stroke="#1f2937" stroke-width="5" />
            <line x1="160" y1="170" x2="142" y2="300" stroke="#cbd5e1" stroke-width="2" />
            <line x1="480" y1="170" x2="498" y2="300" stroke="#1f2937" stroke-width="5" />
            <line x1="480" y1="170" x2="498" y2="300" stroke="#cbd5e1" stroke-width="2" />
          </g>

          <!-- ======================= HEADLIGHTS ======================= -->
          <g class="hood-car__headlights">
            <path d="M 22 402 L 172 414 L 158 442 Q 84 448 30 434 Z" fill="#05080f" stroke="#64748b" stroke-width="1.4" />
            <polyline class="hood-car__drl" points="34,420 112,430 160,418" fill="none" stroke="#e0f2fe" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
            <circle class="hood-car__lamp" cx="70" cy="428" r="7" fill="#64748b" />
            <circle class="hood-car__lamp" cx="96" cy="432" r="5" fill="#64748b" />

            <path d="M 618 402 L 468 414 L 482 442 Q 556 448 610 434 Z" fill="#05080f" stroke="#64748b" stroke-width="1.4" />
            <polyline class="hood-car__drl" points="606,420 528,430 480,418" fill="none" stroke="#e0f2fe" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
            <circle class="hood-car__lamp" cx="570" cy="428" r="7" fill="#64748b" />
            <circle class="hood-car__lamp" cx="544" cy="432" r="5" fill="#64748b" />
          </g>

          <!-- ========================= GRILLE ========================= -->
          <!-- Upper chrome slat grille -->
          <path d="M 184 414 L 456 414 L 444 456 L 196 456 Z" fill="#05080f" />
          <g stroke="url(#r7-chrome)" stroke-width="3" stroke-linecap="round">
            <line x1="190" y1="422" x2="450" y2="422" />
            <line x1="192" y1="432" x2="448" y2="432" />
            <line x1="194" y1="442" x2="446" y2="442" />
            <line x1="196" y1="451" x2="444" y2="451" />
          </g>
          <!-- Center horseshoe grille -->
          <path d="M 284 410 Q 320 402 356 410 L 362 466 Q 320 490 278 466 Z" fill="url(#r7-mesh)" stroke="url(#r7-chrome)" stroke-width="3.5" />
          <rect x="304" y="428" width="32" height="12" rx="2" fill="#0b1220" stroke="#93c5fd" stroke-width="1" />
          <text x="320" y="437.5" text-anchor="middle" fill="#e0f2fe" font-family="JetBrains Mono, monospace" font-weight="800" font-size="8" letter-spacing="1">R007</text>

          <!-- Lower intake & side ducts -->
          <path d="M 120 472 L 270 472 Q 320 494 370 472 L 520 472 L 500 502 L 140 502 Z" fill="url(#r7-mesh)" stroke="#1e3a8a" stroke-width="1.5" />
          <path d="M 28 456 L 100 466 L 112 502 L 46 502 Q 30 486 28 456 Z" fill="url(#r7-mesh)" stroke="#1e3a8a" stroke-width="1.5" />
          <path d="M 612 456 L 540 466 L 528 502 L 594 502 Q 610 486 612 456 Z" fill="url(#r7-mesh)" stroke="#1e3a8a" stroke-width="1.5" />

          <!-- Carbon front splitter -->
          <path d="M 38 512 L 602 512 L 590 526 L 50 526 Z" fill="#05080f" stroke="#334155" />
        </svg>

        <!-- ============================================================ -->
        <!-- LAYER 2: THE HOOD (two faces, hinged at the windshield)       -->
        <!-- ============================================================ -->
        <div class="hood-car__lid">
          <!-- Outer hood skin (visible when closed) -->
          <svg class="hood-car__face hood-car__face--top" viewBox="0 0 480 150" preserveAspectRatio="none" aria-hidden="true">
            <defs>
              <linearGradient id="r7-hood" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#1e3a8a" />
                <stop offset="45%" stop-color="#2563eb" />
                <stop offset="100%" stop-color="#1d4ed8" />
              </linearGradient>
              <linearGradient id="r7-hood-bulge" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#1e40af" />
                <stop offset="50%" stop-color="#3b82f6" />
                <stop offset="100%" stop-color="#1e40af" />
              </linearGradient>
            </defs>

            <path d="M 52 2 Q 240 -4 428 2 L 478 140 Q 240 154 2 140 Z" fill="url(#r7-hood)" stroke="#60a5fa" stroke-width="1.4" stroke-opacity="0.6" />

            <!-- Center power bulge -->
            <path d="M 182 3 Q 240 0 298 3 L 320 144 Q 240 150 160 144 Z" fill="url(#r7-hood-bulge)" />
            <path d="M 182 3 L 160 144" stroke="#93c5fd" stroke-width="1.3" stroke-opacity="0.7" />
            <path d="M 298 3 L 320 144" stroke="#93c5fd" stroke-width="1.3" stroke-opacity="0.7" />

            <!-- Side creases -->
            <path d="M 110 4 L 60 140" stroke="#93c5fd" stroke-width="1" stroke-opacity="0.35" />
            <path d="M 370 4 L 420 140" stroke="#93c5fd" stroke-width="1" stroke-opacity="0.35" />

            <!-- Twin nostril vents at the front of the bulge -->
            <path d="M 194 104 L 232 100 L 232 122 L 188 126 Z" fill="#05080f" stroke="#1e3a8a" />
            <path d="M 286 104 L 248 100 L 248 122 L 292 126 Z" fill="#05080f" stroke="#1e3a8a" />
            <g stroke="#1e293b" stroke-width="2">
              <line x1="194" y1="112" x2="230" y2="109" />
              <line x1="192" y1="119" x2="230" y2="116" />
              <line x1="286" y1="112" x2="250" y2="109" />
              <line x1="288" y1="119" x2="250" y2="116" />
            </g>

            <!-- Heat-extractor louvres -->
            <g stroke="#0b1f4d" stroke-width="3" stroke-linecap="round">
              <line x1="104" y1="40" x2="136" y2="42" />
              <line x1="100" y1="52" x2="133" y2="54" />
              <line x1="96" y1="64" x2="130" y2="66" />
              <line x1="376" y1="40" x2="344" y2="42" />
              <line x1="380" y1="52" x2="347" y2="54" />
              <line x1="384" y1="64" x2="350" y2="66" />
            </g>

            <!-- Specular highlight -->
            <path d="M 120 6 L 200 4 L 120 140 L 60 138 Z" fill="#ffffff" fill-opacity="0.06" />
          </svg>

          <!-- Hood underside (visible when open) -->
          <svg class="hood-car__face hood-car__face--under" viewBox="0 0 480 150" preserveAspectRatio="none" aria-hidden="true">
            <path d="M 2 10 Q 240 -6 478 10 L 428 148 Q 240 152 52 148 Z" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.2" stroke-opacity="0.6" />
            <!-- Inner structural frame -->
            <path d="M 28 20 Q 240 8 452 20 L 412 138 L 68 138 Z" fill="#1e3a8a" />
            <g fill="#0b1f4d">
              <ellipse cx="120" cy="52" rx="44" ry="16" />
              <ellipse cx="240" cy="42" rx="52" ry="14" />
              <ellipse cx="360" cy="52" rx="44" ry="16" />
              <ellipse cx="160" cy="100" rx="46" ry="18" />
              <ellipse cx="320" cy="100" rx="46" ry="18" />
            </g>
            <!-- Bolts -->
            <g fill="#60a5fa" fill-opacity="0.7">
              <circle cx="60" cy="30" r="3" /><circle cx="420" cy="30" r="3" />
              <circle cx="240" cy="72" r="3" /><circle cx="90" cy="126" r="3" />
              <circle cx="390" cy="126" r="3" /><circle cx="240" cy="128" r="3" />
            </g>
            <!-- Latch striker -->
            <rect x="232" y="12" width="16" height="14" rx="2" fill="#94a3b8" />
            <!-- Under-hood LED lamps -->
            <g class="hood-car__under-lamp">
              <rect x="120" y="122" width="64" height="11" rx="3" fill="#0b1220" />
              <rect x="296" y="122" width="64" height="11" rx="3" fill="#0b1220" />
              <g fill="#e0f2fe">
                <rect x="124" y="125" width="8" height="5" rx="1" /><rect x="136" y="125" width="8" height="5" rx="1" />
                <rect x="148" y="125" width="8" height="5" rx="1" /><rect x="160" y="125" width="8" height="5" rx="1" />
                <rect x="172" y="125" width="8" height="5" rx="1" />
                <rect x="300" y="125" width="8" height="5" rx="1" /><rect x="312" y="125" width="8" height="5" rx="1" />
                <rect x="324" y="125" width="8" height="5" rx="1" /><rect x="336" y="125" width="8" height="5" rx="1" />
                <rect x="348" y="125" width="8" height="5" rx="1" />
              </g>
            </g>
          </svg>
        </div>
      </div>

      <!-- Subtle Interactive Status Pill -->
      <button type="button" class="loader__hint" (click)="popHoodNow()">
        <span class="loader__hint-dot"></span>
        <span>{{ hoodPopped() ? 'ENGINE BAY EXPOSED · CLICK TO CLOSE HOOD' : 'UNLOCKING HOOD · CLICK TO POP NOW' }}</span>
      </button>
    </div>

    <!-- Streamlined Bottom Progress & Status Bar -->
    <footer class="loader__foot">
      <div class="loader__bar-row">
        <span class="loader__status">{{ currentStatus() }}</span>
        <span class="loader__pct">{{ progress() }}%</span>
      </div>
      <div class="loader__track">
        <span class="loader__fill" [style.width.%]="progress()"></span>
      </div>
    </footer>
  </div>
}
