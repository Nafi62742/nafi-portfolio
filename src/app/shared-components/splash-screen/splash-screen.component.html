@if (sceneService.splashOpen()) {
  <div
    class="loader"
    [class.is-hood-open]="hoodPopped()"
    [class.is-exiting]="isExiting()"
    role="dialog"
    aria-modal="true"
    aria-label="R 007 Ignition Splash Screen">

    <!-- Minimal Top Header Bar -->
    <header class="loader__top">
      <div class="loader__brand">
        <span class="loader__dot"></span>
        <span class="loader__code">R-007 // {{ sceneService.config().splash.model }}</span>
      </div>

      <div class="loader__top-right">
        <div class="loader__rpm">
          <span>{{ rpmValue() }}</span>
          <small>RPM</small>
        </div>
        <button type="button" class="loader__skip-btn" (click)="dismissSplash()">
          <span>SKIP</span>
          <span aria-hidden="true">→</span>
        </button>
      </div>
    </header>

    <!-- Free-standing front view of the R-007 supercar (no frame / box) -->
    <div class="loader__stage">
      <div
        class="hood-car"
        [class.is-open]="hoodPopped()"
        role="button"
        tabindex="0"
        aria-label="Click to open or close the R 007 car hood"
        (click)="popHoodNow()"
        (keydown.enter)="popHoodNow()">

        <!-- ============================================================ -->
        <!-- LAYER 1: CAR BODY, CABIN, ENGINE BAY, LIGHTS & CHROME GRILLE   -->
        <!-- Design matches the reference supercar: candy metallic red body, -->
        <!-- 5-bar horizontal chrome grille, stamped slam panel, and        -->
        <!-- realistic engine bay with fluid reservoirs & V10 cover.       -->
        <!-- ============================================================ -->
        <svg class="hood-car__body-svg" viewBox="0 0 640 580" aria-hidden="true">
          <defs>
            <!-- Metallic Red Paint Gradients -->
            <linearGradient id="r7-red-paint" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ef4444" />
              <stop offset="28%" stop-color="#dc2626" />
              <stop offset="68%" stop-color="#b91c1c" />
              <stop offset="100%" stop-color="#7f1d1d" />
            </linearGradient>
            <linearGradient id="r7-red-dark" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#991b1b" />
              <stop offset="100%" stop-color="#450a0a" />
            </linearGradient>
            <linearGradient id="r7-red-side" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#450a0a" stop-opacity="0.8" />
              <stop offset="18%" stop-color="#450a0a" stop-opacity="0" />
              <stop offset="82%" stop-color="#450a0a" stop-opacity="0" />
              <stop offset="100%" stop-color="#450a0a" stop-opacity="0.8" />
            </linearGradient>
            <!-- Glass & Chrome Gradients -->
            <linearGradient id="r7-windshield" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#1e293b" />
              <stop offset="60%" stop-color="#0f172a" />
              <stop offset="100%" stop-color="#020617" />
            </linearGradient>
            <linearGradient id="r7-chrome-bar" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="28%" stop-color="#e2e8f0" />
              <stop offset="55%" stop-color="#94a3b8" />
              <stop offset="85%" stop-color="#cbd5e1" />
              <stop offset="100%" stop-color="#475569" />
            </linearGradient>
            <!-- Engine Bay Materials -->
            <linearGradient id="r7-v10-cover" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#3f3f46" />
              <stop offset="55%" stop-color="#27272a" />
              <stop offset="100%" stop-color="#09090b" />
            </linearGradient>
            <linearGradient id="r7-fluid-tank" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9" />
              <stop offset="50%" stop-color="#f5eedc" />
              <stop offset="100%" stop-color="#d6cfc0" />
            </linearGradient>
            <radialGradient id="r7-ground-shadow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#000000" stop-opacity="0.8" />
              <stop offset="100%" stop-color="#000000" stop-opacity="0" />
            </radialGradient>
            <!-- Hex Mesh for lower intake -->
            <pattern id="r7-dark-mesh" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <rect width="6" height="6" fill="#09090b" />
              <line x1="0" y1="0" x2="0" y2="6" stroke="#1f2937" stroke-width="1.2" />
              <line x1="0" y1="0" x2="6" y2="0" stroke="#1f2937" stroke-width="1.2" />
            </pattern>
          </defs>

          <!-- Ground shadow -->
          <ellipse cx="320" cy="562" rx="300" ry="16" fill="url(#r7-ground-shadow)" />

          <!-- ==================== CABIN & WINDSHIELD ==================== -->
          <!-- Roof & A-pillars -->
          <path d="M 200 162 Q 320 146 440 162 L 536 250 L 104 250 Z" fill="url(#r7-red-paint)" stroke="#f87171" stroke-width="0.8" stroke-opacity="0.5" />
          <!-- Dark tinted windshield -->
          <path d="M 194 174 Q 320 160 446 174 L 518 246 L 122 246 Z" fill="url(#r7-windshield)" />
          <!-- Windshield glass reflection -->
          <path d="M 210 178 L 270 174 L 190 242 L 140 242 Z" fill="#ffffff" fill-opacity="0.08" />
          <!-- Rear-view mirror -->
          <rect x="306" y="176" width="28" height="7" rx="2.5" fill="#020617" stroke="#334155" stroke-width="0.8" />

          <!-- Side mirrors -->
          <path d="M 112 230 L 60 220 Q 48 228 54 242 L 108 248 Z" fill="url(#r7-red-paint)" stroke="#f87171" stroke-width="0.8" />
          <path d="M 528 230 L 580 220 Q 592 228 586 242 L 532 248 Z" fill="url(#r7-red-paint)" stroke="#f87171" stroke-width="0.8" />

          <!-- Wiper cowl tray -->
          <path d="M 112 246 L 528 246 L 536 266 L 104 266 Z" fill="#09090b" stroke="#18181b" />
          <g stroke="#18181b" stroke-width="2.5" stroke-linecap="round">
            <line x1="220" y1="254" x2="300" y2="254" />
            <line x1="340" y1="254" x2="420" y2="254" />
          </g>

          <!-- ==================== FRONT BODYWORK ==================== -->
          <!-- Fenders, nose & bumper perimeter -->
          <path
            d="M 104 260 L 536 260 C 580 268 614 300 622 344 L 628 440 C 630 490 618 530 596 544 L 44 544 C 22 530 10 490 12 440 L 18 344 C 26 300 60 268 104 260 Z"
            fill="url(#r7-red-paint)" />
          <path
            d="M 104 260 L 536 260 C 580 268 614 300 622 344 L 628 440 C 630 490 618 530 596 544 L 44 544 C 22 530 10 490 12 440 L 18 344 C 26 300 60 268 104 260 Z"
            fill="url(#r7-red-side)" />

          <!-- Lateral fender highlight creases -->
          <path d="M 98 268 C 58 300 36 344 32 410" fill="none" stroke="#fca5a5" stroke-width="1.6" stroke-opacity="0.55" />
          <path d="M 542 268 C 582 300 604 344 608 410" fill="none" stroke="#fca5a5" stroke-width="1.6" stroke-opacity="0.55" />

          <!-- ======================= ENGINE BAY ======================= -->
          <!-- Deep dark engine bay cavity -->
          <path d="M 124 262 L 516 262 L 550 388 Q 320 402 90 388 Z" fill="#090d16" />

          <!-- Left strut tower & inner fender -->
          <ellipse cx="148" cy="296" rx="24" ry="13" fill="#991b1b" stroke="#ef4444" stroke-width="1.2" />
          <circle cx="148" cy="296" r="5" fill="#94a3b8" />
          <!-- Right strut tower & inner fender -->
          <ellipse cx="492" cy="296" rx="24" ry="13" fill="#991b1b" stroke="#ef4444" stroke-width="1.2" />
          <circle cx="492" cy="296" r="5" fill="#94a3b8" />

          <!-- Left side: Coolant expansion tank (translucent beige with blue pressure cap) -->
          <rect x="100" y="328" width="74" height="40" rx="6" fill="url(#r7-fluid-tank)" stroke="#a8a29e" stroke-width="1.2" />
          <!-- Ribbed tank level ridges -->
          <g stroke="#a8a29e" stroke-width="1.2">
            <line x1="112" y1="338" x2="112" y2="360" />
            <line x1="124" y1="338" x2="124" y2="360" />
            <line x1="136" y1="338" x2="136" y2="360" />
            <line x1="148" y1="338" x2="148" y2="360" />
            <line x1="160" y1="338" x2="160" y2="360" />
          </g>
          <ellipse cx="154" cy="328" rx="10" ry="4.5" fill="#2563eb" stroke="#1d4ed8" />

          <!-- Left side: Battery box & terminals -->
          <rect x="176" y="286" width="50" height="38" rx="3.5" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
          <rect x="180" y="280" width="9" height="7" rx="1.5" fill="#dc2626" />
          <rect x="213" y="280" width="9" height="7" rx="1.5" fill="#27272a" stroke="#52525b" />
          <!-- Fuse box / electronic module -->
          <rect x="178" y="330" width="46" height="32" rx="3" fill="#18181b" stroke="#3f3f46" />

          <!-- Center: V10 Twin Turbo Engine Cover (with idle vibration) -->
          <g class="engine__cover">
            <path
              d="M 246 278 L 394 278 Q 410 282 412 298 L 416 356 Q 416 370 400 372 L 240 372 Q 224 370 224 356 L 228 298 Q 230 282 246 278 Z"
              fill="url(#r7-v10-cover)" stroke="#52525b" stroke-width="1.4" />
            <!-- Intake runner contours -->
            <path d="M 264 288 L 376 288 L 382 342 L 258 342 Z" fill="#09090b" stroke="#3f3f46" />
            <g stroke="#52525b" stroke-width="2.6" stroke-linecap="round">
              <line x1="270" y1="298" x2="370" y2="298" />
              <line x1="268" y1="309" x2="372" y2="309" />
              <line x1="266" y1="320" x2="374" y2="320" />
              <line x1="264" y1="331" x2="376" y2="331" />
            </g>
            <!-- Red/Silver R-007 Badge on engine -->
            <rect x="282" y="348" width="76" height="15" rx="3" fill="#991b1b" stroke="#ef4444" stroke-width="0.8" />
            <text x="320" y="359" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-weight="800" font-size="8.5" letter-spacing="2">R 007 // V10</text>
            <circle cx="396" cy="288" r="5" fill="#3f3f46" stroke="#a1a1aa" />
          </g>

          <!-- Right side: Air filter box & intake duct -->
          <rect x="424" y="284" width="60" height="42" rx="4" fill="#18181b" stroke="#3f3f46" />
          <g stroke="#27272a" stroke-width="2.2">
            <line x1="430" y1="294" x2="478" y2="294" />
            <line x1="430" y1="304" x2="478" y2="304" />
            <line x1="430" y1="314" x2="478" y2="314" />
          </g>

          <!-- Right side: Translucent Washer fluid tank with twin caps -->
          <rect x="466" y="328" width="70" height="38" rx="6" fill="url(#r7-fluid-tank)" stroke="#a8a29e" stroke-width="1.2" />
          <g stroke="#a8a29e" stroke-width="1.2">
            <line x1="478" y1="338" x2="478" y2="360" />
            <line x1="490" y1="338" x2="490" y2="360" />
            <line x1="502" y1="338" x2="502" y2="360" />
            <line x1="514" y1="338" x2="514" y2="360" />
            <line x1="524" y1="338" x2="524" y2="360" />
          </g>
          <ellipse cx="484" cy="328" rx="8" ry="4" fill="#18181b" stroke="#52525b" />
          <ellipse cx="518" cy="328" rx="8" ry="4" fill="#18181b" stroke="#52525b" />

          <!-- Front Slam Panel (Radiator Core Support in body red with stamped cooling cutouts) -->
          <path d="M 96 372 L 544 372 L 552 396 Q 320 408 88 396 Z" fill="url(#r7-red-paint)" stroke="#f87171" stroke-width="1" />
          <!-- Stamped structural cutouts revealing dark radiator core -->
          <g fill="#09090b" stroke="#7f1d1d" stroke-width="1">
            <rect x="146" y="378" width="44" height="10" rx="4" />
            <rect x="226" y="380" width="54" height="10" rx="4" />
            <rect x="360" y="380" width="54" height="10" rx="4" />
            <rect x="450" y="378" width="44" height="10" rx="4" />
          </g>
          <!-- Center Hood Latch Striker Receptacle -->
          <rect x="312" y="378" width="16" height="12" rx="2" fill="#71717a" stroke="#d4d4d8" />

          <!-- ======================= HEADLIGHTS ======================= -->
          <g class="hood-car__headlights">
            <!-- Left Headlight -->
            <path d="M 20 400 L 168 408 L 156 444 Q 80 450 26 432 Z" fill="#09090b" stroke="#94a3b8" stroke-width="1.6" />
            <!-- Crystal LED Reflector Arrays (stepped like the reference photo) -->
            <g stroke="#e2e8f0" stroke-width="1.8" stroke-linecap="round">
              <line x1="42" y1="416" x2="80" y2="420" />
              <line x1="44" y1="423" x2="90" y2="427" />
              <line x1="46" y1="430" x2="96" y2="434" />
            </g>
            <polyline class="hood-car__drl" points="30,414 116,424 162,412" fill="none" stroke="#e0f2fe" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
            <circle class="hood-car__lamp" cx="120" cy="426" r="7" fill="#64748b" />
            <circle class="hood-car__lamp" cx="142" cy="428" r="5" fill="#64748b" />

            <!-- Right Headlight -->
            <path d="M 620 400 L 472 408 L 484 444 Q 560 450 614 432 Z" fill="#09090b" stroke="#94a3b8" stroke-width="1.6" />
            <!-- Crystal LED Reflector Arrays -->
            <g stroke="#e2e8f0" stroke-width="1.8" stroke-linecap="round">
              <line x1="598" y1="416" x2="560" y2="420" />
              <line x1="596" y1="423" x2="550" y2="427" />
              <line x1="594" y1="430" x2="544" y2="434" />
            </g>
            <polyline class="hood-car__drl" points="610,414 524,424 478,412" fill="none" stroke="#e0f2fe" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
            <circle class="hood-car__lamp" cx="520" cy="426" r="7" fill="#64748b" />
            <circle class="hood-car__lamp" cx="498" cy="428" r="5" fill="#64748b" />
          </g>

          <!-- =================== 5-BAR CHROME GRILLE =================== -->
          <!-- Dark intake cavity behind the grille -->
          <path d="M 174 404 L 466 404 L 452 472 Q 320 486 188 472 Z" fill="#05080f" stroke="#7f1d1d" stroke-width="1.2" />

          <!-- The 5 Curved Horizontal Chrome Bars (Signature feature from the reference photo) -->
          <g stroke="url(#r7-chrome-bar)" stroke-linecap="round">
            <!-- Bar 1 (Top) -->
            <path d="M 178 412 Q 320 404 462 412" fill="none" stroke-width="4.2" filter="drop-shadow(0 2px 2px rgba(0,0,0,0.6))" />
            <!-- Bar 2 -->
            <path d="M 180 424 Q 320 416 460 424" fill="none" stroke-width="4" filter="drop-shadow(0 2px 2px rgba(0,0,0,0.6))" />
            <!-- Bar 3 (Center) -->
            <path d="M 183 437 Q 320 429 457 437" fill="none" stroke-width="3.8" filter="drop-shadow(0 2px 2px rgba(0,0,0,0.6))" />
            <!-- Bar 4 -->
            <path d="M 186 450 Q 320 442 454 450" fill="none" stroke-width="3.6" filter="drop-shadow(0 2px 2px rgba(0,0,0,0.6))" />
            <!-- Bar 5 (Bottom) -->
            <path d="M 190 463 Q 320 455 450 463" fill="none" stroke-width="3.4" filter="drop-shadow(0 2px 2px rgba(0,0,0,0.6))" />
          </g>

          <!-- Center Chrome Tooth / Accent Badge -->
          <rect x="308" y="426" width="24" height="14" rx="2" fill="#09090b" stroke="url(#r7-chrome-bar)" stroke-width="1.4" />
          <text x="320" y="436.5" text-anchor="middle" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-weight="800" font-size="7" letter-spacing="1">R007</text>

          <!-- Lower bumper intake & chin spoiler -->
          <path d="M 160 492 L 480 492 L 464 522 L 176 522 Z" fill="url(#r7-dark-mesh)" stroke="#7f1d1d" stroke-width="1.2" />
          <!-- Lower air bar -->
          <line x1="190" y1="507" x2="450" y2="507" stroke="#dc2626" stroke-width="2.5" />
          <!-- Carbon front splitter lip -->
          <path d="M 38 536 L 602 536 L 590 550 L 50 550 Z" fill="#09090b" stroke="#27272a" />

          <!-- ============================================================ -->
          <!-- LAYER 2A: OPEN HOOD ASSEMBLY (RAISED HIGH IN AIR LIKE PHOTO) -->
          <!-- Featuring stamped sheet metal with 3 large oval cutouts,     -->
          <!-- dual heat vents, and hydraulic struts holding it upright!    -->
          <!-- ============================================================ -->
          <g class="hood-car__open-assembly">
            <!-- Hydraulic Gas Struts (Anchor: Strut Towers to Mid-Hood) -->
            <g class="hood-car__struts" stroke-linecap="round">
              <!-- Left Strut: Black pressurized cylinder + chrome piston -->
              <line x1="148" y1="296" x2="166" y2="198" stroke="#18181b" stroke-width="5.5" />
              <line x1="166" y1="198" x2="178" y2="140" stroke="#f1f5f9" stroke-width="2.8" />
              <circle cx="178" cy="140" r="3.5" fill="#71717a" stroke="#d4d4d8" />
              <!-- Right Strut: Black pressurized cylinder + chrome piston -->
              <line x1="492" y1="296" x2="474" y2="198" stroke="#18181b" stroke-width="5.5" />
              <line x1="474" y1="198" x2="462" y2="140" stroke="#f1f5f9" stroke-width="2.8" />
              <circle cx="462" cy="140" r="3.5" fill="#71717a" stroke="#d4d4d8" />
            </g>

            <!-- Underside Hood Skin (Propped up high in perspective) -->
            <path
              d="M 136 210 Q 106 100 200 48 Q 320 30 440 48 Q 534 100 504 210 L 476 254 Q 320 264 164 254 Z"
              fill="url(#r7-red-paint)" stroke="#f87171" stroke-width="1.6" filter="drop-shadow(0 10px 16px rgba(0,0,0,0.7))" />

            <!-- Inner Structural Perimeter Frame -->
            <path
              d="M 152 204 Q 124 110 206 62 Q 320 46 434 62 Q 516 110 488 204 L 462 242 Q 320 252 178 242 Z"
              fill="url(#r7-red-dark)" stroke="#dc2626" stroke-width="1.2" />

            <!-- The 3 Large Stamped Structural Recesses (Direct match to reference photo!) -->
            <!-- 1. Center Tall Stamped Recess -->
            <path
              d="M 288 68 Q 320 60 352 68 L 362 138 Q 320 148 278 138 Z"
              fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
            <path d="M 294 74 L 346 74 L 354 132 L 286 132 Z" fill="#260404" />

            <!-- 2. Left Contoured Stamped Recess -->
            <path
              d="M 190 84 Q 248 74 266 90 L 254 150 Q 198 156 172 130 Z"
              fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
            <path d="M 198 90 L 246 84 L 242 142 L 182 124 Z" fill="#260404" />

            <!-- 3. Right Contoured Stamped Recess -->
            <path
              d="M 450 84 Q 392 74 374 90 L 386 150 Q 442 156 468 130 Z"
              fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
            <path d="M 442 90 L 394 84 L 398 142 L 458 124 Z" fill="#260404" />

            <!-- Dual Rectangular Heat-Extractor Vents (Below the ovals, matching photo) -->
            <!-- Left Vent -->
            <rect x="204" y="162" width="76" height="18" rx="2" fill="#09090b" stroke="#ef4444" stroke-width="1" />
            <g stroke="#3f3f46" stroke-width="1.8">
              <line x1="210" y1="168" x2="274" y2="168" />
              <line x1="210" y1="174" x2="274" y2="174" />
            </g>
            <!-- Right Vent -->
            <rect x="360" y="162" width="76" height="18" rx="2" fill="#09090b" stroke="#ef4444" stroke-width="1" />
            <g stroke="#3f3f46" stroke-width="1.8">
              <line x1="366" y1="168" x2="430" y2="168" />
              <line x1="366" y1="174" x2="430" y2="174" />
            </g>

            <!-- Center Hood Latch Pin -->
            <rect x="314" y="240" width="12" height="10" rx="2" fill="#cbd5e1" stroke="#475569" />

            <!-- Dual Under-Hood Work Lamps with clean illumination -->
            <g class="hood-car__under-lamp">
              <rect x="136" y="214" width="36" height="8" rx="2" fill="#09090b" stroke="#e0f2fe" stroke-width="0.8" />
              <rect x="468" y="214" width="36" height="8" rx="2" fill="#09090b" stroke="#e0f2fe" stroke-width="0.8" />
              <line x1="140" y1="218" x2="168" y2="218" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
              <line x1="472" y1="218" x2="500" y2="218" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
            </g>
          </g>

          <!-- ============================================================ -->
          <!-- LAYER 2B: CLOSED HOOD (COVERS THE BAY WHEN HOOD IS SHUT)     -->
          <!-- Sculpted red metallic surface with center power bulge        -->
          <!-- ============================================================ -->
          <g class="hood-car__closed-lid">
            <path
              d="M 104 260 L 536 260 L 544 382 Q 320 398 96 382 Z"
              fill="url(#r7-red-paint)" stroke="#f87171" stroke-width="1.4" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.5))" />
            <!-- Center power bulge -->
            <path d="M 230 260 L 410 260 L 430 382 Q 320 392 210 382 Z" fill="url(#r7-red-dark)" />
            <path d="M 230 260 L 210 382" stroke="#fca5a5" stroke-width="1.5" stroke-opacity="0.8" />
            <path d="M 410 260 L 430 382" stroke="#fca5a5" stroke-width="1.5" stroke-opacity="0.8" />
            <!-- Side creases -->
            <path d="M 150 262 L 130 380" stroke="#fca5a5" stroke-width="1" stroke-opacity="0.4" />
            <path d="M 490 262 L 510 380" stroke="#fca5a5" stroke-width="1" stroke-opacity="0.4" />
            <!-- Front hood vents -->
            <rect x="250" y="356" width="36" height="8" rx="2" fill="#09090b" stroke="#7f1d1d" />
            <rect x="354" y="356" width="36" height="8" rx="2" fill="#09090b" stroke="#7f1d1d" />
            <!-- Specular gloss sweep across the closed hood -->
            <path d="M 160 262 L 240 260 L 170 380 L 120 380 Z" fill="#ffffff" fill-opacity="0.12" />
          </g>
        </svg>
      </div>

      <!-- Subtle Interactive Status Pill -->
      <button type="button" class="loader__hint" (click)="popHoodNow()">
        <span class="loader__hint-dot"></span>
        <span>{{ hoodPopped() ? 'ENGINE BAY EXPOSED · CLICK TO CLOSE HOOD' : 'UNLOCKING HOOD · CLICK TO POP NOW' }}</span>
      </button>
    </div>

    <!-- Streamlined Bottom Progress & Status Bar -->
    <footer class="loader__foot">
      <div class="loader__bar-row">
        <span class="loader__status">{{ currentStatus() }}</span>
        <span class="loader__pct">{{ progress() }}%</span>
      </div>
      <div class="loader__track">
        <span class="loader__fill" [style.width.%]="progress()"></span>
      </div>
    </footer>
  </div>
}
