<footer class="footer-root">
  <!-- Dynamic Cosmic Starfield Layers -->
  <div class="starfield-bg" aria-hidden="true">
    <div class="stars-cluster stars-sm"></div>
    <div class="stars-cluster stars-md"></div>
  </div>

  <div class="footer-container">

    <button class="footer-logo-btn" (click)="scroll.scrollTo('hero')">
      <span class="text-text-muted">&lt;</span>
      <span class="text-text-primary">Nafi</span>
      <span class="text-accent">.</span>
      <span class="gradient-text">dev</span>
      <span class="text-text-muted">/&gt;</span>
    </button>

    <p class="footer-text">
      © {{ year }} Nafi Ahmed. {{ t.t('footer.rights') }}
    </p>

    <p class="footer-text">
      {{ t.t('footer.built_with') }}
    </p>

  </div>
</footer>
