<footer class="site-footer" data-night>
  <div class="site-footer__brand">
    <button type="button" class="site-footer__logo" (click)="scroll.scrollTo('hero')">
      <svg class="brand__mark" viewBox="0 0 64 48" aria-hidden="true">
        <polygon points="32,2 60,12 54,38 32,46 10,38 4,12" fill="#070d19" stroke="var(--amber)" stroke-width="2.5" />
        <path d="M21 15 L11 24 L21 33" fill="none" stroke="var(--red)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M43 15 L53 24 L43 33" fill="none" stroke="var(--amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <text x="32" y="30" text-anchor="middle" fill="#edf4fc" font-family="Archivo, sans-serif" font-weight="900" font-size="18">R</text>
      </svg>
      <span>NAFI // <em>RACER007</em></span>
    </button>
    <p class="site-footer__tag">
      {{ t.t('footer.built_with') }} · Dhaka, Bangladesh
    </p>
  </div>

  <div class="site-footer__meta">
    <span>© {{ year }} Nafi Ahmed. {{ t.t('footer.rights') }}</span>
    <span class="site-footer__dual">FRONT × BACK // WEB · MOBILE · CLOUD · DATA</span>
  </div>

  <div class="site-footer__actions">
    <button type="button" class="site-footer__top" (click)="scroll.scrollTo('hero')">
      Back to top ↑
    </button>
  </div>
</footer>
