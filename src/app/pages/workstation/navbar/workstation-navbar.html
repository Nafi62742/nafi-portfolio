<header class="ws-nav-root">
  <div class="ws-nav-container">
    <!-- LEFT: Module Identity -->
    <div class="ws-left-group">
      <a routerLink="/workstation/simulation" class="ws-brand-link" title="SYS::WORKSTATION Lab">
        <i class="fa-solid fa-server text-cyan-400 text-sm"></i>
        <span class="ws-brand-text font-mono font-bold tracking-wider">SYS::WORKSTATION</span>
      </a>
    </div>

    <!-- CENTER: Dedicated Workstation Subpage Tabs -->
    <nav class="ws-tabs-nav hidden lg:flex" aria-label="Workstation Navigation">
      @for (tab of tabs; track tab.id) {
        <a
          [routerLink]="tab.route"
          routerLinkActive="active"
          class="ws-tab-btn"
          [id]="'ws-tab-' + tab.id">
          <i [class]="'fa-solid ' + tab.icon + ' ' + tab.color + ' text-xs'"></i>
          <span>{{ tab.label }}</span>
        </a>
      }
    </nav>

    <!-- RIGHT: Rig Selector Dropdown, Staged Mods, Theme Toggle & Mobile Hamburger -->
    <div class="ws-right-group">
      <!-- Quick Rig Selector Dropdown (Desktop) -->
      <div class="ws-rig-dropdown-wrap hidden xl:flex">
        <label for="ws-nav-rig-select" class="sr-only">Active PC Rig</label>
        <div class="select-wrapper">
          <select
            id="ws-nav-rig-select"
            class="ws-nav-rig-select"
            [value]="ws.activeRigId()"
            (change)="onRigSelect($event)"
            title="Active Desktop Rig">
            @for (rig of rigPresets; track rig.id) {
              <option [value]="rig.id">{{ rig.name }}</option>
            }
          </select>
          <i class="fa-solid fa-chevron-down select-caret"></i>
        </div>
      </div>

      <!-- Staged modifications alert pill (if any) -->
      @if (ws.hasAnyPendingChange()) {
        <button
          type="button"
          class="ws-staged-btn"
          (click)="applyMods()"
          title="Apply staged hardware modifications">
          <i class="fa-solid fa-bolt mr-1 text-[10px] text-amber-400"></i>
          <span class="font-mono text-[11px] font-bold">APPLY MODS</span>
        </button>
      }

      <!-- Theme Toggle -->
      <button
        type="button"
        class="theme-toggle-btn"
        (click)="theme.toggle()"
        id="ws-nav-theme-toggle"
        aria-label="Toggle theme">
        <i class="fa-solid" [class.fa-sun]="theme.isDark" [class.fa-moon]="!theme.isDark"></i>
      </button>

      <!-- Mobile Hamburger Button -->
      <button
        type="button"
        class="hamburger-btn lg:hidden"
        id="ws-nav-hamburger"
        (click)="toggleMenu()"
        aria-label="Toggle workstation menu">
        <span class="hamburger-line"
          [style.transform]="menuOpen() ? 'translateY(7px) rotate(45deg)' : 'none'">
        </span>
        <span class="hamburger-line"
          [style.opacity]="menuOpen() ? '0' : '1'"
          [style.transform]="menuOpen() ? 'scaleX(0)' : 'none'">
        </span>
        <span class="hamburger-line"
          [style.transform]="menuOpen() ? 'translateY(-7px) rotate(-45deg)' : 'none'">
        </span>
      </button>
    </div>
  </div>

  <!-- Mobile Drawer Menu -->
  <div class="ws-mobile-menu"
    [class.ws-mobile-closed]="!menuOpen()"
    [class.ws-mobile-open]="menuOpen()">
    
    <!-- Mobile Rig Switcher Dropdown -->
    <div class="ws-mobile-rig-group mb-3">
      <label for="ws-mobile-rig-select" class="text-[10px] font-mono font-bold uppercase tracking-wider text-text-muted px-1 mb-1.5 block">ACTIVE RIG PRESET</label>
      <div class="select-wrapper w-full">
        <select
          id="ws-mobile-rig-select"
          class="ws-mobile-rig-select w-full"
          [value]="ws.activeRigId()"
          (change)="onRigSelect($event); toggleMenu()">
          @for (rig of rigPresets; track rig.id) {
            <option [value]="rig.id">{{ rig.name }}</option>
          }
        </select>
        <i class="fa-solid fa-chevron-down select-caret"></i>
      </div>
    </div>

    <!-- Mobile Subpage Tabs -->
    <ul class="ws-mobile-links-list">
      @for (tab of tabs; track tab.id; let i = $index) {
        <li>
          <a
            [routerLink]="tab.route"
            routerLinkActive="active"
            class="ws-mobile-tab-btn"
            [style.animation-delay]="i * 60 + 'ms'"
            (click)="toggleMenu()">
            <i [class]="'fa-solid ' + tab.icon + ' ' + tab.color + ' w-5 text-center'"></i>
            <span>{{ tab.label }}</span>
          </a>
        </li>
      }
    </ul>
  </div>
</header>
