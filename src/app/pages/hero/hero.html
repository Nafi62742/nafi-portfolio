<section class="hero-section">
  <!-- Tech Grid Background Pattern -->
  <div class="tech-grid-bg"></div>

  <!-- Ambient glowing orbs (subtle corner lighting) -->
  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-3"></div>

  <div class="hero-container">
    <!-- Content -->
    <div class="hero-content">
      <div class="hero-header-group">
        <h2 class="hero-greeting">{{ t.t("hero.greeting") }}</h2>

        <h1 class="hero-name">{{ t.t("hero.name") }}</h1>
      </div>

      <!-- Static role display replacing the typewriter -->
      <div class="hero-role-container">
        <span class="hero-role-prefix">I am a</span>
        <span class="hero-role-text">{{ t.t("hero.role") }}</span>
      </div>

      <!-- Tagline with sub-bullet points -->
      <div class="hero-tagline-container">
        <p class="hero-tagline-title">{{ t.t("hero.tagline_prefix") }}</p>
        <ul class="hero-tagline-bullets">
          <li>
            <span class="bullet-dot bullet-dot-1"></span>
            <span class="bullet-text">{{ t.t("hero.tagline_web") }}</span>
          </li>
          <li>
            <span class="bullet-dot bullet-dot-2"></span>
            <span class="bullet-text">{{ t.t("hero.tagline_mobile") }}</span>
          </li>
          <li>
            <span class="bullet-dot bullet-dot-3"></span>
            <span class="bullet-text">{{ t.t("hero.tagline_cloud") }}</span>
          </li>
        </ul>
        <p class="hero-location-text">
          <i class="fa-solid fa-location-dot location-icon"></i>
          <span>{{ t.t("hero.location") }}</span>
        </p>
      </div>

      <!-- Social Quick Links (GitHub, LinkedIn, Email) -->
      <div class="hero-socials">
        <a
          [href]="githubUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="social-link"
          aria-label="GitHub Profile"
          title="GitHub">
          <i class="fa-brands fa-github"></i>
        </a>
        <a
          [href]="linkedinUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="social-link"
          aria-label="LinkedIn Profile"
          title="LinkedIn">
          <i class="fa-brands fa-linkedin-in"></i>
        </a>
        <a
          [href]="'https://mail.google.com/mail/?view=cm&fs=1&to=' + emailAddress"
          (click)="copyEmail(emailAddress, $event)"
          class="social-link"
          aria-label="Send Email"
          title="Send Email">
          <i class="fa-solid fa-envelope"></i>
        </a>
        @if (copied()) {
          <span class="copied-indicator">
            <i class="fa-solid fa-check"></i>
            <span>Email Copied!</span>
          </span>
        }
      </div>
    </div>

    <!-- Hero Graphic (3D WebGL Interactive Technology Sphere) -->
    <div class="hero-graphic">
      <app-hero-sphere></app-hero-sphere>
    </div>
  </div>
</section>
