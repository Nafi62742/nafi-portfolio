<section class="hero-section">
  <!-- Tech Grid Background Pattern -->
  <div class="tech-grid-bg"></div>

  <!-- Ambient glowing orbs (subtle corner lighting) -->
  <div class="glow-orb glow-orb-1"></div>
  <div class="glow-orb glow-orb-3"></div>

  <div class="hero-container">
    <!-- Content -->
    <div class="hero-content">
      <div class="hero-header-group">
        <h2 class="hero-greeting">{{ t.t("hero.greeting") }}</h2>

        <h1 class="hero-name">{{ t.t("hero.name") }}</h1>
      </div>

      <!-- Static role display replacing the typewriter -->
      <div class="hero-role-container">
        <span class="hero-role-prefix">I am a</span>
        <span class="hero-role-text">{{ t.t("hero.role") }}</span>
      </div>

      <!-- Compact Tagline + Inline Domain Pills + Research Spotlight -->
      <div class="hero-tagline-container">
        <p class="hero-tagline-title">
          Building scalable
          <span class="domain-pill pill-web">Web</span>,
          <span class="domain-pill pill-mobile">Mobile</span> &amp;
          <span class="domain-pill pill-cloud">Cloud-Powered</span>
          applications from
          <span class="hero-location-inline">
            <i class="fa-solid fa-location-dot location-icon"></i>
            {{ t.t("hero.location") }}
          </span>
        </p>

        <!-- Research & Publications Spotlight Badge -->
        <button
          type="button"
          (click)="scrollToPublications()"
          class="hero-research-spotlight"
        >
          <span class="research-icon-badge">
            <i class="fa-solid fa-flask-vial"></i>
          </span>
          <span class="research-spotlight-text">
            <strong>3 Peer-Reviewed Publications</strong>
            <span class="research-sub">IEEE Xplore &amp; ML/DL Journals</span>
          </span>
          <i class="fa-solid fa-arrow-right research-arrow"></i>
        </button>
      </div>

      <!-- Social Quick Links (GitHub, LinkedIn, Email) -->
      <div class="hero-socials">
        <a
          [href]="githubUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="social-link"
          aria-label="GitHub Profile"
          title="GitHub">
          <i class="fa-brands fa-github"></i>
        </a>
        <a
          [href]="linkedinUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="social-link"
          aria-label="LinkedIn Profile"
          title="LinkedIn">
          <i class="fa-brands fa-linkedin-in"></i>
        </a>
        <a
          [href]="whatsappUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="social-link"
          aria-label="WhatsApp"
          title="WhatsApp: 01760887297">
          <i class="fa-brands fa-whatsapp"></i>
        </a>
        <a
          [href]="'https://mail.google.com/mail/?view=cm&fs=1&to=' + emailAddress"
          (click)="copyEmail(emailAddress, $event)"
          class="social-link"
          aria-label="Send Email"
          title="Send Email">
          <i class="fa-solid fa-envelope"></i>
        </a>
        @if (copied()) {
          <span class="copied-indicator">
            <i class="fa-solid fa-check"></i>
            <span>Email Copied!</span>
          </span>
        }
      </div>
    </div>

    <!-- Hero Graphic (3D WebGL Interactive Technology Sphere) -->
    <div class="hero-graphic">
      <app-hero-sphere></app-hero-sphere>
    </div>
  </div>
</section>
