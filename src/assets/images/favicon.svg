<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="50%" stop-color="#070d19" />
      <stop offset="100%" stop-color="#040811" />
    </linearGradient>
    <linearGradient id="cobalt-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cyan-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Outer Hexagonal Hood Shield -->
  <polygon
    points="256,20 468,112 428,396 256,492 84,396 44,112"
    fill="url(#bg-grad)"
    stroke="#38bdf8"
    stroke-width="14"
    stroke-linejoin="round" />

  <!-- Inner Racing Telemetry Border -->
  <polygon
    points="256,46 442,128 406,380 256,464 106,380 70,128"
    fill="none"
    stroke="#2563eb"
    stroke-width="5"
    stroke-dasharray="22 12" />

  <!-- Center Split Racing Stripe (Left Cobalt / Right Cyan) -->
  <rect x="232" y="48" width="24" height="414" fill="#2563eb" opacity="0.28" />
  <rect x="256" y="48" width="24" height="414" fill="#38bdf8" opacity="0.28" />

  <!-- Left Developer Code Wing `<` (Cobalt) -->
  <path
    d="M178 128 L88 232 L178 336 L178 292 L128 232 L178 172 Z"
    fill="url(#cobalt-wing)" />

  <!-- Right Racer Aero Wing `>` (Cyan) -->
  <path
    d="M334 128 L424 232 L334 336 L334 292 L384 232 L334 172 Z"
    fill="url(#cyan-wing)" />

  <!-- Center Bold "R" Emblem (Nafi × Racer007) -->
  <text
    x="256"
    y="264"
    text-anchor="middle"
    fill="#eef4fb"
    font-family="Archivo, Arial Black, sans-serif"
    font-weight="900"
    font-size="168"
    letter-spacing="4">R</text>

  <!-- Horizontal Hood Accent Bar -->
  <rect x="136" y="292" width="120" height="10" rx="3" fill="#2563eb" />
  <rect x="256" y="292" width="120" height="10" rx="3" fill="#38bdf8" />

  <!-- Bottom "007" Stencil Badge -->
  <rect
    x="152"
    y="322"
    width="208"
    height="68"
    rx="8"
    fill="#050a14"
    stroke="#38bdf8"
    stroke-width="5" />
  <text
    x="256"
    y="372"
    text-anchor="middle"
    fill="#38bdf8"
    font-family="JetBrains Mono, Courier New, monospace"
    font-weight="800"
    font-size="52"
    letter-spacing="8">007</text>

  <!-- Top "NAFI" Micro Tag -->
  <text
    x="256"
    y="104"
    text-anchor="middle"
    fill="#93c5fd"
    font-family="JetBrains Mono, Courier New, monospace"
    font-weight="700"
    font-size="26"
    letter-spacing="10">NAFI</text>
</svg>
